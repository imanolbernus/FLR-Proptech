import { API_BASE_URL, ApiError } from "./client";
import { clearToken, getToken } from "@/api/authToken";
import type { Documento } from "@/types/entities";

// El endpoint de documentos sube archivos vía multipart/form-data y descarga
// bytes crudos, por lo que no encaja con el cliente JSON genérico de
// client.ts (que siempre manda Content-Type: application/json y parsea la
// respuesta como JSON). Aquí se maneja fetch directamente, reutilizando el
// mismo token y el mismo manejo de 401 que el resto de la app.

export const documentosApi = {
  listByPropiedad: (propiedadId: string) =>
    fetch(`${API_BASE_URL}/documentos/?propiedad_id=${propiedadId}`, {
      headers: authHeaders(),
    }).then((res) => parseJson<Documento[]>(res)),

  upload: async ({
    archivo,
    propiedadIds,
    descripcion,
  }: {
    archivo: File;
    propiedadIds: string[];
    descripcion?: string;
  }) => {
    const formData = new FormData();
    formData.append("archivo", archivo);
    propiedadIds.forEach((id) => formData.append("propiedad_ids", id));
    if (descripcion) formData.append("descripcion", descripcion);

    const token = getToken();
    const res = await fetch(`${API_BASE_URL}/documentos/`, {
      method: "POST",
      headers: token ? { Authorization: `Bearer ${token}` } : undefined,
      body: formData,
    });
    return parseJson<Documento>(res);
  },

  remove: async (id: string) => {
    const res = await fetch(`${API_BASE_URL}/documentos/${id}`, {
      method: "DELETE",
      headers: authHeaders(),
    });
    if (res.status === 401) clearToken();
    if (!res.ok && res.status !== 204) {
      const body = await res.json().catch(() => null);
      throw new ApiError(res.status, body?.detail ?? body);
    }
  },

  /** Descarga el archivo como blob y dispara la apertura/guardado en el navegador. */
  descargar: async (doc: Documento) => {
    const res = await fetch(`${API_BASE_URL}/documentos/${doc.id}/descargar`, {
      headers: authHeaders(),
    });
    if (res.status === 401) clearToken();
    if (!res.ok) throw new ApiError(res.status, "No se pudo descargar el archivo");

    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.target = "_blank";
    a.rel = "noopener";
    a.download = doc.nombre_archivo;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 30_000);
  },
};

function authHeaders(): HeadersInit {
  const token = getToken();
  return token ? { Authorization: `Bearer ${token}` } : {};
}

async function parseJson<T>(res: Response): Promise<T> {
  if (res.status === 401) clearToken();
  const body = await res.json().catch(() => null);
  if (!res.ok) {
    const detail = body && typeof body === "object" && "detail" in body ? body.detail : body;
    throw new ApiError(res.status, detail);
  }
  return body as T;
}
